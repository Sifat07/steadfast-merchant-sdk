name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24] # vitest 5 needs >= 22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: dist
          path: dist

  # The published package supports Node >= 18 even though the dev tools don't.
  runtime:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Load both entry points (CJS and ESM) and sign a webhook body
        run: |
          node -e "const {SteadfastClient}=require('./dist/index.js'); const w=require('./dist/webhooks.js'); new SteadfastClient({apiKey:'k',secretKey:'s'}); if(!w.verifySteadfastWebhook('{}',{authorization:'Bearer t','x-signature':w.signSteadfastWebhook('{}','t')},'t')) process.exit(1)"
          node --input-type=module -e "const m=await import('./dist/index.mjs'); await import('./dist/webhooks.mjs'); new m.SteadfastClient({apiKey:'k',secretKey:'s'})"
