name: Release

# Publishes to npm. Called by release-please.yml; a GitHub release published
# by hand (tag vX.Y.Z matching package.json) also triggers it.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: test "${TAG#v}" = "$(node -p "require('./package.json').version")"
      # prepublishOnly runs type-check, test and build.
      - run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
